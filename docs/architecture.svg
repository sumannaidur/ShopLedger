<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A component diagram of the browser UI, Express server, routes, business libraries, configuration, JSON datastore, and the numbered order-placement flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 24px Arial,sans-serif;fill:#0f172a}.subtitle{font:14px Arial,sans-serif;fill:#475569}
      .group{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}.group-title{font:700 15px Arial,sans-serif;fill:#334155}
      .node{fill:#ffffff;stroke:#94a3b8;stroke-width:1.3}.server{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.router{fill:#eff6ff;stroke:#60a5fa}.lib{fill:#f8fafc;stroke:#94a3b8}.ticket{fill:#fff1e6;stroke:#ea580c;stroke-width:2}.data{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.config{fill:#fefce8;stroke:#ca8a04;stroke-width:1.5}
      .name{font:700 13px Arial,sans-serif;fill:#0f172a}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:12px Arial,sans-serif;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:1.35;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrow)}.step{fill:#2563eb}.steptext{font:700 12px Arial,sans-serif;fill:#ffffff}.legend{font:12px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text x="32" y="38" class="title">ShopLedger architecture</text>
  <text x="32" y="60" class="subtitle">Node / Express POS, Khata ledger, GST pricing, printable invoices</text>

  <!-- Browser -->
  <rect x="32" y="92" width="230" height="154" rx="10" class="group"/>
  <text x="48" y="119" class="group-title">Browser UI</text>
  <rect x="48" y="135" width="198" height="42" rx="6" class="node"/>
  <text x="61" y="153" class="name">public/index.html</text><text x="61" y="170" class="tiny">POS, orders, Khata, audit views</text>
  <rect x="48" y="188" width="198" height="42" rx="6" class="node"/>
  <text x="61" y="206" class="name">public/js/app.js</text><text x="61" y="223" class="tiny">XHR GET/POST and UI rendering</text>

  <!-- Server -->
  <rect x="317" y="105" width="236" height="95" rx="10" class="server"/>
  <text x="336" y="134" class="name">server.js</text>
  <text x="336" y="154" class="small">Express + bodyParser.json()</text>
  <text x="336" y="173" class="small">static public/ · mounts /api</text>
  <text x="336" y="191" class="small">GET /orders/:id/invoice</text>

  <!-- Routers -->
  <rect x="32" y="282" width="521" height="180" rx="10" class="group"/>
  <text x="48" y="309" class="group-title">routes/ — HTTP endpoints</text>
  <rect x="48" y="325" width="235" height="53" rx="6" class="router"/>
  <text x="61" y="345" class="name">routes/products.js</text><text x="61" y="364" class="tiny">GET /products · GET /coupons</text>
  <rect x="300" y="325" width="237" height="53" rx="6" class="router"/>
  <text x="313" y="345" class="name">routes/orders.js</text><text x="313" y="364" class="tiny">GET/POST /orders · POST /cancel</text>
  <rect x="48" y="394" width="235" height="53" rx="6" class="router"/>
  <text x="61" y="414" class="name">routes/customers.js</text><text x="61" y="433" class="tiny">GET /customers · POST /settle</text>
  <rect x="300" y="394" width="237" height="53" rx="6" class="router"/>
  <text x="313" y="414" class="name">routes/reports.js</text><text x="313" y="433" class="tiny">dashboard · reconciliation · preview · export</text>

  <!-- Configuration and persistence -->
  <rect x="588" y="92" width="248" height="108" rx="10" class="config"/>
  <text x="606" y="121" class="name">config.js</text>
  <text x="606" y="142" class="small">shop · port · tax.hsnSlabs</text>
  <text x="606" y="161" class="small">inventory defaults · coupons</text>
  <text x="606" y="180" class="small">adminKey</text>
  <rect x="877" y="105" width="282" height="95" rx="10" class="data"/>
  <text x="895" y="134" class="name">data/db.json</text>
  <text x="895" y="154" class="small">products · customers · orders</text>
  <text x="895" y="173" class="small">settlements · auditLog · ID counters</text>

  <!-- Libs -->
  <rect x="588" y="236" width="571" height="401" rx="10" class="group"/>
  <text x="606" y="263" class="group-title">lib/ — business and data logic</text>
  <rect x="606" y="280" width="166" height="62" rx="6" class="lib"/>
  <text x="618" y="301" class="name">store.js</text><text x="618" y="320" class="tiny">read · write · appendAudit</text>
  <rect x="785" y="280" width="174" height="62" rx="6" class="lib"/>
  <text x="797" y="301" class="name">orders.js</text><text x="797" y="320" class="tiny">add · get · cancel · list</text>
  <rect x="972" y="280" width="169" height="62" rx="6" class="lib"/>
  <text x="984" y="301" class="name">inventory.js</text><text x="984" y="320" class="tiny">find · check · reserve · release</text>
  <rect x="606" y="356" width="166" height="62" rx="6" class="lib"/>
  <text x="618" y="377" class="name">ledger.js</text><text x="618" y="396" class="tiny">Khata charge · settlement</text>
  <rect x="785" y="356" width="174" height="62" rx="6" class="lib"/>
  <text x="797" y="377" class="name">coupons.js</text><text x="797" y="396" class="tiny">normalize · validate · discount</text>
  <rect x="972" y="356" width="169" height="62" rx="6" class="ticket"/>
  <text x="984" y="377" class="name">tax.js</text><text x="984" y="396" class="tiny">HSN rate · CGST/SGST split</text>
  <rect x="606" y="432" width="166" height="62" rx="6" class="lib"/>
  <text x="618" y="453" class="name">pricing.js</text><text x="618" y="472" class="tiny">subtotal · computeTotals</text>
  <rect x="785" y="432" width="174" height="62" rx="6" class="ticket"/>
  <text x="797" y="453" class="name">invoice.js</text><text x="797" y="472" class="tiny">computeInvoiceFigures · render</text>
  <rect x="972" y="432" width="169" height="62" rx="6" class="lib"/>
  <text x="984" y="453" class="name">reports.js</text><text x="984" y="472" class="tiny">dashboard · GST reconciliation</text>
  <rect x="606" y="508" width="166" height="62" rx="6" class="lib"/>
  <text x="618" y="529" class="name">dates.js</text><text x="618" y="548" class="tiny">today · normalizeDateKey · FY</text>
  <text x="795" y="540" class="tiny">Highlighted modules are ticket focus.</text>

  <!-- structural dependencies -->
  <path d="M262 164 H317" class="edge"/>
  <path d="M435 200 V282" class="edge"/>
  <path d="M553 151 H588" class="dash"/>
  <path d="M836 151 H877" class="dash"/>
  <path d="M877 200 V250 H689 V280" class="edge"/>
  <path d="M836 200 V250 H1056 V280" class="dash"/>
  <path d="M959 311 H972" class="edge"/>
  <path d="M1056 342 V356" class="edge"/>
  <path d="M959 387 H972" class="edge"/>
  <path d="M772 463 H785" class="edge"/>

  <!-- numbered checkout flow -->
  <text x="32" y="678" class="group-title">Numbered flow: placing an order</text>
  <path d="M75 714 H230" class="flow"/><circle cx="57" cy="714" r="13" class="step"/><text x="53" y="718" class="steptext">1</text>
  <text x="83" y="708" class="small">app.js POST</text><text x="83" y="725" class="tiny">/api/orders</text>
  <path d="M245 714 H400" class="flow"/><circle cx="227" cy="714" r="13" class="step"/><text x="223" y="718" class="steptext">2</text>
  <text x="253" y="708" class="small">orders route</text><text x="253" y="725" class="tiny">load and resolve items</text>
  <path d="M415 714 H570" class="flow"/><circle cx="397" cy="714" r="13" class="step"/><text x="393" y="718" class="steptext">3</text>
  <text x="423" y="708" class="small">stock + coupon</text><text x="423" y="725" class="tiny">check and validate</text>
  <path d="M585 714 H740" class="flow"/><circle cx="567" cy="714" r="13" class="step"/><text x="563" y="718" class="steptext">4</text>
  <text x="593" y="708" class="small">pricing.computeTotals</text><text x="593" y="725" class="tiny">discount + HSN GST</text>
  <path d="M755 714 H910" class="flow"/><circle cx="737" cy="714" r="13" class="step"/><text x="733" y="718" class="steptext">5</text>
  <text x="763" y="708" class="small">reserve / Khata / add</text><text x="763" y="725" class="tiny">mutate in-memory DB</text>
  <path d="M925 714 H1080" class="flow"/><circle cx="907" cy="714" r="13" class="step"/><text x="903" y="718" class="steptext">6</text>
  <text x="933" y="708" class="small">store.write</text><text x="933" y="725" class="tiny">data/db.json + response</text>

  <!-- Legend -->
  <rect x="32" y="752" width="1127" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="48" y="760" width="16" height="14" class="server"/><text x="71" y="772" class="legend">server</text>
  <rect x="143" y="760" width="16" height="14" class="router"/><text x="166" y="772" class="legend">router</text>
  <rect x="235" y="760" width="16" height="14" class="lib"/><text x="258" y="772" class="legend">library</text>
  <rect x="338" y="760" width="16" height="14" class="ticket"/><text x="361" y="772" class="legend">ticket focus: invoice.js, tax.js</text>
  <rect x="565" y="760" width="16" height="14" class="data"/><text x="588" y="772" class="legend">persistent JSON data</text>
  <line x1="743" y1="767" x2="778" y2="767" class="flow"/><text x="788" y="772" class="legend">order flow</text>
  <line x1="888" y1="767" x2="923" y2="767" class="dash"/><text x="933" y="772" class="legend">dependency/configuration</text>
</svg>
